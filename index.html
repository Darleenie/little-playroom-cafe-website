<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Little Playroom Cafe - Temporarily Out of Service</title>
    <meta name="description" content="The Little Playroom Cafe website is currently out of service.">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #fdf6ee;
            color: #3a3a3a;
            text-align: center;
        }
        .notice {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .notice img { width: 96px; height: auto; margin-bottom: 24px; }
        .notice h2 { font-size: 0.95rem; letter-spacing: 0.12em; font-weight: 600; color: #888; margin-bottom: 12px; }
        .notice h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 16px; }
        .notice p { font-size: 1.05rem; line-height: 1.6; margin-bottom: 12px; }
        .notice a { color: #d0703a; font-weight: 600; text-decoration: none; }
        .notice a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="notice">
        <img src="images/logo.svg" alt="Little Playroom Cafe Logo">
        <h2>LITTLE PLAYROOM CAFÉ</h2>
        <h1>Website Currently Out of Service</h1>
        <p>Our website is temporarily unavailable. We apologize for any inconvenience.</p>
        <p>Please visit us at <a href="https://littleplayroommadison.com/">littleplayroommadison.com</a>.</p>
        <p>For questions, please email us at <a href="mailto:playroommadison@gmail.com">playroommadison@gmail.com</a>.</p>
    </main>
</body>
</html>
